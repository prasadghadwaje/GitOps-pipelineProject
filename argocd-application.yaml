apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devboard-eks
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/prasadghadwaje/GitOps-pipelineProject.git
    targetRevision: main
    path: k8s/eks

  destination:
    server: https://kubernetes.default.svc
    namespace: devboard-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true